# Include INSIDE the existing HTTPS server {} only. Keep port 80 redirect-only.
# Preserve /dav in the upstream URL: the WebDAV app is mounted at /dav.
location = /dav {
    return 308 /dav/;
}

location ^~ /dav/ {
    proxy_pass http://127.0.0.1:4287;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Replace incoming values so clients cannot forge the proxy's IP/scheme.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_redirect off;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    client_max_body_size 1m;
}
